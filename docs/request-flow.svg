<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Instrument Sans',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="cr">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#8C9389" stroke-width="1.6" stroke-linecap="round"/>
  </marker>
  <style>
    .bx{fill:none;stroke-width:2.6;filter:url(#cr);stroke-linejoin:round}
    .fl{stroke:none;opacity:.13;filter:url(#cr)}
    .t{font-size:14.5px;font-weight:600;fill:#1B1E1B}
    .s{font-size:11.5px;fill:#767E75}
    .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;fill:#A8AEA5}
    .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#8C9389}
    .zone{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#A8AEA5;letter-spacing:.14em}
    .arw{fill:none;stroke:#8C9389;stroke-width:1.8;marker-end:url(#ar);filter:url(#cr)}
    .dash{stroke-dasharray:5 5}
  </style>
</defs>

<rect width="900" height="620" fill="#FBFAF8"/>
<ellipse cx="120" cy="60" rx="300" ry="180" fill="#7C9A78" opacity=".07"/>
<ellipse cx="800" cy="150" rx="260" ry="170" fill="#9E93BC" opacity=".06"/>
<ellipse cx="620" cy="600" rx="300" ry="160" fill="#C08B62" opacity=".05"/>

<text x="42" y="52" font-size="25" font-weight="600" fill="#1B1E1B" letter-spacing="-.6">Request flow</text>
<text x="42" y="74" class="s">Three independent flows leave the browser. Inference never touches the control plane.</text>

<text x="42" y="116" class="zone">CLIENT</text>
<g>
  <rect class="fl" x="42" y="128" width="300" height="76" fill="#7BA0C4"/>
  <rect class="bx" x="42" y="128" width="300" height="76" stroke="#7BA0C4"/>
  <text x="62" y="154" class="t">Browser</text>
  <text x="62" y="173" class="s">Catalog · Deployments · Playground</text>
  <text x="62" y="192" class="m">plain HTML + JS, no build step</text>
</g>

<path class="arw" d="M96 206 L96 268"/>
<text x="46" y="242" class="lbl">:8080</text>

<path class="arw" d="M212 206 L212 268"/>
<text x="222" y="242" class="lbl">:8001</text>

<path class="arw dash" d="M336 168 C560 168, 780 220, 782 300"/>
<text x="440" y="150" class="lbl">:8000 — direct to the model</text>

<g>
  <rect class="fl" x="42" y="278" width="128" height="80" fill="#9E93BC"/>
  <rect class="bx" x="42" y="278" width="128" height="80" stroke="#9E93BC"/>
  <text x="60" y="304" class="t">nginx</text>
  <text x="60" y="322" class="s">static files</text>
  <text x="60" y="341" class="m">almacigo-ui</text>
</g>

<g>
  <rect class="fl" x="198" y="278" width="240" height="150" fill="#7C9A78"/>
  <rect class="bx" x="198" y="278" width="240" height="150" stroke="#7C9A78"/>
  <text x="216" y="304" class="t">Control plane</text>
  <text x="216" y="322" class="s">FastAPI · lifecycle management</text>
  <text x="216" y="346" class="m">GET  /api/models</text>
  <text x="216" y="364" class="m">POST /api/deployments</text>
  <text x="216" y="382" class="m">GET  /api/deployments</text>
  <text x="216" y="400" class="m">DEL  /api/deployments</text>
  <text x="216" y="418" class="m">GET  /api/health</text>
</g>

<g>
  <rect class="fl" x="660" y="300" width="200" height="150" fill="#7BA0C4"/>
  <rect class="bx" x="660" y="300" width="200" height="150" stroke="#7BA0C4" stroke-dasharray="8 4"/>
  <text x="678" y="326" class="t">vLLM</text>
  <text x="678" y="344" class="s">OpenAI-compatible server</text>
  <text x="678" y="368" class="m">/v1/models</text>
  <text x="678" y="386" class="m">/v1/chat/completions</text>
  <text x="678" y="404" class="m">/metrics</text>
  <text x="678" y="430" class="m" fill="#C08B62">created on demand</text>
</g>

<g>
  <rect class="fl" x="198" y="474" width="240" height="52" fill="#C08B62"/>
  <rect class="bx" x="198" y="474" width="240" height="52" stroke="#C08B62"/>
  <text x="216" y="497" class="t">Docker daemon</text>
  <text x="216" y="515" class="m">/var/run/docker.sock</text>
</g>
<path class="arw" d="M318 430 L318 470"/>
<text x="328" y="456" class="lbl">docker sdk</text>
<path class="arw" d="M442 494 C560 490, 600 452, 656 424"/>
<text x="452" y="530" class="lbl">creates / destroys</text>

<path class="arw dash" d="M440 350 C520 356, 560 344, 656 344"/>
<text x="484" y="336" class="lbl">probe /v1/models</text>

<g>
  <rect class="fl" x="660" y="500" width="200" height="60" fill="#C08B62"/>
  <rect class="bx" x="660" y="500" width="200" height="60" stroke="#C08B62"/>
  <text x="678" y="524" class="t">Weights on disk</text>
  <text x="678" y="543" class="m">~/models/* · safetensors</text>
</g>
<path class="arw" d="M760 496 L760 456"/>
<text x="770" y="482" class="lbl">volume :ro</text>

<path class="arw dash" d="M440 400 C520 440, 580 510, 654 524"/>
<text x="470" y="452" class="lbl">lists the catalog</text>
</svg>
