  <rect class="bx" x="276" y="336" width="196" height="102" stroke="#C47B7B"/>
  <text x="292" y="358" class="t">NSG · firewall</text>
  <text x="292" y="378" class="m">1010  8080  ui</text>
  <text x="292" y="394" class="m">1020  8001  control plane</text>
  <text x="292" y="410" class="m">1030  8000  inference</text>
  <text x="292" y="426" class="m">  —     22   ssh</text>
</g>
<path class="arw" d="M476 388 L516 388"/>

<text x="520" y="330" class="zone">VNET / SUBNET</text>
