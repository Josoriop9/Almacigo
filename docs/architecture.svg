<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" width="980" height="860" font-family="'Instrument Sans',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="cr">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="13" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#8C9389" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
  <marker id="arg" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#7C9A78" stroke-width="1.7" stroke-linecap="round"/>
  </marker>
  <style>
    .bx{fill:none;stroke-width:2.5;filter:url(#cr);stroke-linejoin:round}
    .fl{stroke:none;opacity:.13;filter:url(#cr)}
    .t{font-size:13.5px;font-weight:600;fill:#1B1E1B}
    .s{font-size:11px;fill:#767E75}
    .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;fill:#A8AEA5}
    .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#8C9389}
    .zone{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#A8AEA5;letter-spacing:.14em}
    .arw{fill:none;stroke:#8C9389;stroke-width:1.7;marker-end:url(#ar);filter:url(#cr)}
    .arwg{fill:none;stroke:#7C9A78;stroke-width:1.7;marker-end:url(#arg);filter:url(#cr)}
    .dash{stroke-dasharray:5 5}
  </style>
</defs>

<rect width="980" height="860" fill="#FBFAF8"/>
<ellipse cx="140" cy="70" rx="320" ry="190" fill="#9E93BC" opacity=".07"/>
<ellipse cx="870" cy="240" rx="270" ry="190" fill="#7C9A78" opacity=".06"/>
<ellipse cx="560" cy="850" rx="340" ry="160" fill="#C08B62" opacity=".05"/>

<text x="42" y="52" font-size="25" font-weight="600" fill="#1B1E1B" letter-spacing="-.6">Almácigo</text>
<text x="42" y="74" class="s">Infrastructure and request flow. Grey = network · Green = application logic</text>

<text x="42" y="112" class="zone">YOUR MACHINE</text>
<g>
  <rect class="fl" x="42" y="124" width="248" height="80" fill="#7BA0C4"/>
  <rect class="bx" x="42" y="124" width="248" height="80" stroke="#7BA0C4"/>
  <text x="60" y="150" class="t">Browser</text>
  <text x="60" y="169" class="s">Catalog · Deployments · Playground</text>
  <text x="60" y="188" class="m">fetch originates here, not on the VM</text>
</g>

<path class="arw" d="M166 206 L166 250"/>
<text x="176" y="232" class="lbl">internet</text>

<text x="42" y="272" class="zone">AZURE SUBSCRIPTION · EAST US</text>
<rect class="bx" x="42" y="284" width="896" height="500" stroke="#D3CFC7" stroke-dasharray="7 6"/>

<text x="64" y="312" class="zone">RESOURCE GROUP</text>
<rect class="bx" x="64" y="324" width="852" height="440" stroke="#C08B62" stroke-dasharray="4 4"/>

<g>
  <rect class="fl" x="88" y="348" width="146" height="58" fill="#9E93BC"/>
  <rect class="bx" x="88" y="348" width="146" height="58" stroke="#9E93BC"/>
