  <text x="410" y="841" class="s">GPU VM · NC4as_T4_v3</text>
  <rect class="bx" x="592" y="822" width="146" height="30" stroke="#A8AEA5" stroke-dasharray="5 4"/>
  <text x="606" y="841" class="s">Gateway / APIM</text>
