  <rect class="fl" x="538" y="362" width="96" height="52" fill="#7BA0C4"/>
  <rect class="bx" x="538" y="362" width="96" height="52" stroke="#7BA0C4"/>
  <text x="554" y="384" class="t">NIC</text>
  <text x="554" y="401" class="m">10.0.0.4</text>
</g>

<g>
  <rect class="fl" x="690" y="348" width="204" height="90" fill="#C08B62"/>
  <rect class="bx" x="690" y="348" width="204" height="90" stroke="#C08B62"/>
  <text x="708" y="371" class="t">Managed Disk</text>
  <text x="708" y="390" class="s">OS + model weights</text>
  <text x="708" y="409" class="m">~/models/qwen2.5-0.5b</text>
  <text x="708" y="425" class="m">~/models/…-instruct</text>
</g>

<text x="88" y="470" class="zone">VM · UBUNTU 24.04 · 4 vCPU · 16 GB · NO GPU</text>
<rect class="bx" x="88" y="482" width="806" height="258" stroke="#7C9A78"/>

<text x="108" y="508" class="zone">DOCKER ENGINE</text>

<g>
  <rect class="fl" x="108" y="520" width="180" height="86" fill="#9E93BC"/>
  <rect class="bx" x="108" y="520" width="180" height="86" stroke="#9E93BC"/>
  <text x="124" y="543" class="t">almacigo-ui</text>
  <text x="124" y="561" class="s">nginx · serves the HTML</text>
  <text x="124" y="580" class="m">:8080</text>
  <text x="124" y="596" class="m">declared in compose</text>
</g>

<g>
  <rect class="fl" x="316" y="520" width="222" height="140" fill="#7C9A78"/>
  <rect class="bx" x="316" y="520" width="222" height="140" stroke="#7C9A78"/>
  <text x="332" y="543" class="t">almacigo-control-plane</text>
  <text x="332" y="561" class="s">FastAPI</text>
  <text x="332" y="582" class="m">GET  /api/models</text>
  <text x="332" y="598" class="m">POST /api/deployments</text>
  <text x="332" y="614" class="m">GET  /api/deployments ← probe</text>
  <text x="332" y="630" class="m">:8001</text>
  <text x="332" y="650" class="m">declared in compose</text>
</g>

<g>
  <rect class="fl" x="606" y="520" width="252" height="140" fill="#7BA0C4"/>
  <rect class="bx" x="606" y="520" width="252" height="140" stroke="#7BA0C4" stroke-dasharray="8 4"/>
  <text x="622" y="543" class="t">almacigo-deployment</text>
  <text x="622" y="561" class="s">vLLM · created and destroyed on demand</text>
  <text x="622" y="582" class="m">/v1/models</text>
  <text x="622" y="598" class="m">/v1/chat/completions</text>
  <text x="622" y="614" class="m">/metrics</text>
  <text x="622" y="630" class="m">:8000</text>
  <text x="622" y="650" class="m" fill="#C08B62">NOT in compose</text>
  <path d="M840 536 L842 548 M835 542 L848 541" stroke="#C08B62" stroke-width="2.1"
        stroke-linecap="round" fill="none" filter="url(#cr)"/>
</g>

<g>
  <rect class="fl" x="316" y="684" width="222" height="42" fill="#C08B62"/>
  <rect class="bx" x="316" y="684" width="222" height="42" stroke="#C08B62"/>
  <text x="332" y="710" class="m" fill="#767E75">/var/run/docker.sock</text>
</g>
<path class="arwg" d="M427 662 L427 680"/>
<path class="arwg" d="M542 704 C578 702, 590 672, 604 652"/>
<text x="548" y="736" class="lbl">creates / destroys</text>

