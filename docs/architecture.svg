<text x="762" y="486" class="lbl">volume :ro</text>
<path class="arw dash" d="M700 442 L520 520"/>
<text x="556" y="474" class="lbl">lists the catalog</text>

<path class="arwg dash" d="M112 214 C74 300, 70 470, 128 516"/>
<text x="46" y="420" class="lbl" fill="#7C9A78">:8080</text>

<path class="arwg dash" d="M212 214 C240 320, 250 480, 322 518"/>
<text x="230" y="432" class="lbl" fill="#7C9A78">:8001</text>

<path class="arwg dash" d="M286 176 C520 176, 900 260, 880 512"/>
