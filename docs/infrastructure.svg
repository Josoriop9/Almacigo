<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="'Instrument Sans',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="cr">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8" fill="none" stroke="#8C9389" stroke-width="1.6" stroke-linecap="round"/>
  </marker>
  <style>
    .bx{fill:none;stroke-width:2.6;filter:url(#cr);stroke-linejoin:round}
    .fl{stroke:none;opacity:.13;filter:url(#cr)}
    .t{font-size:14px;font-weight:600;fill:#1B1E1B}
    .s{font-size:11.5px;fill:#767E75}
    .m{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;fill:#A8AEA5}
    .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#8C9389}
    .zone{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#A8AEA5;letter-spacing:.14em}
  </style>
</defs>

<rect width="900" height="780" fill="#FBFAF8"/>
<ellipse cx="130" cy="70" rx="300" ry="180" fill="#9E93BC" opacity=".07"/>
<ellipse cx="790" cy="200" rx="250" ry="170" fill="#7C9A78" opacity=".06"/>
<ellipse cx="500" cy="760" rx="320" ry="150" fill="#C08B62" opacity=".05"/>

<text x="42" y="52" font-size="25" font-weight="600" fill="#1B1E1B" letter-spacing="-.6">Mini Foundry · infraestructura</text>
<text x="42" y="74" class="s">Recursos de Azure. Lo continuo existe hoy; lo punteado es lo que falta.</text>

<!-- internet -->
<g>
  <rect class="fl" x="42" y="104" width="180" height="58" fill="#7BA0C4"/>
  <rect class="bx" x="42" y="104" width="180" height="58" stroke="#7BA0C4"/>
  <text x="60" y="130" class="t">Tu Mac</text>
  <text x="60" y="148" class="m">navegador + ssh</text>
</g>
<path d="M132 164 L132 200" fill="none" stroke="#8C9389" stroke-width="1.8" marker-end="url(#ar)" filter="url(#cr)"/>
<text x="142" y="186" class="lbl">internet</text>

<!-- ================= SUBSCRIPTION ================= -->
<text x="42" y="228" class="zone">SUBSCRIPTION · EAST US</text>
<rect class="bx" x="42" y="240" width="816" height="452" stroke="#D3CFC7" stroke-dasharray="7 6"/>

<!-- resource group -->
<text x="66" y="272" class="zone">RESOURCE GROUP</text>
<rect class="bx" x="66" y="284" width="768" height="386" stroke="#C08B62" stroke-dasharray="4 4"/>

<!-- public ip -->
<g>
  <rect class="fl" x="92" y="308" width="170" height="66" fill="#9E93BC"/>
  <rect class="bx" x="92" y="308" width="170" height="66" stroke="#9E93BC"/>
  <text x="110" y="332" class="t">Public IP</text>
  <text x="110" y="350" class="s">estática o dinámica</text>
  <text x="110" y="366" class="m">tu punto de entrada</text>
</g>

<!-- NSG -->
<g>
  <rect class="fl" x="300" y="308" width="222" height="118" fill="#C47B7B"/>
  <rect class="bx" x="300" y="308" width="222" height="118" stroke="#C47B7B"/>
  <text x="318" y="332" class="t">NSG</text>
  <text x="318" y="350" class="s">firewall · reglas de entrada</text>
  <text x="318" y="372" class="m">1010  8080  ui</text>
  <text x="318" y="388" class="m">1020  8001  control plane</text>
  <text x="318" y="404" class="m">1030  8000  inferencia</text>
  <text x="318" y="420" class="m">  —    22   ssh</text>
</g>
<path d="M266 340 L296 340" fill="none" stroke="#8C9389" stroke-width="1.8" marker-end="url(#ar)" filter="url(#cr)"/>

<!-- vnet -->
<text x="118" y="418" class="zone">VNET  10.0.0.0/16</text>
<rect class="bx" x="118" y="430" width="164" height="216" stroke="#7BA0C4" stroke-dasharray="4 4"/>
<text x="136" y="458" class="zone">SUBNET</text>
<rect class="bx" x="136" y="468" width="130" height="164" stroke="#7BA0C4" stroke-dasharray="3 4"/>
<g>
  <rect class="fl" x="152" y="492" width="98" height="56" fill="#7BA0C4"/>
  <rect class="bx" x="152" y="492" width="98" height="56" stroke="#7BA0C4"/>
  <text x="168" y="515" class="t">NIC</text>
  <text x="168" y="532" class="m">10.0.0.4</text>
</g>
<text x="152" y="578" class="s">tarjeta de red</text>
<text x="152" y="595" class="s">privada de la VM</text>

<path d="M286 500 L316 500" fill="none" stroke="#8C9389" stroke-width="1.8" marker-end="url(#ar)" filter="url(#cr)"/>

<!-- VM -->
<g>
  <rect class="fl" x="322" y="456" width="238" height="190" fill="#7C9A78"/>
  <rect class="bx" x="322" y="456" width="238" height="190" stroke="#7C9A78"/>
  <text x="340" y="482" class="t">VM  ·  vm-gpu-01</text>
  <text x="340" y="500" class="s">Ubuntu 24.04 · 4 vCPU · 16 GB</text>
  <text x="340" y="518" class="s">sin GPU (cuota pendiente)</text>

  <rect class="bx" x="340" y="534" width="202" height="94" stroke="#767E75" stroke-dasharray="3 3"/>
  <text x="354" y="554" class="m">docker engine</text>
  <text x="354" y="574" class="m">· foundry-ui        :8080</text>
  <text x="354" y="590" class="m">· foundry-control-plane :8001</text>
  <text x="354" y="606" class="m">· foundry-deployment  :8000</text>
  <text x="354" y="622" class="m">· ~/models  (disco)</text>
</g>

<!-- os disk -->
<g>
  <rect class="fl" x="600" y="456" width="200" height="76" fill="#C08B62"/>
  <rect class="bx" x="600" y="456" width="200" height="76" stroke="#C08B62"/>
  <text x="618" y="480" class="t">Managed Disk</text>
  <text x="618" y="498" class="s">SO + pesos de los modelos</text>
  <text x="618" y="516" class="m">~24 GB libres</text>
</g>
<path d="M564 494 L596 494" fill="none" stroke="#8C9389" stroke-width="1.8" marker-end="url(#ar)" filter="url(#cr)"/>

<!-- nota de costo -->
<g>
  <rect class="bx" x="600" y="556" width="200" height="90" stroke="#C47B7B" stroke-dasharray="4 4"/>
  <text x="618" y="580" class="t">Costo</text>
  <text x="618" y="598" class="s">La VM factura mientras corre.</text>
  <text x="618" y="614" class="s">Detenla desde el portal,</text>
  <text x="618" y="630" class="s">no con shutdown.</text>
</g>

<!-- ================= PENDIENTE ================= -->
<text x="42" y="722" class="zone">PENDIENTE</text>
<g opacity=".5">
  <rect class="bx" x="42" y="734" width="176" height="32" stroke="#A8AEA5" stroke-dasharray="5 4"/>
  <text x="56" y="754" class="s">Load Balancer + probe</text>

  <rect class="bx" x="234" y="734" width="150" height="32" stroke="#A8AEA5" stroke-dasharray="5 4"/>
  <text x="248" y="754" class="s">2ª VM en la subnet</text>

  <rect class="bx" x="400" y="734" width="176" height="32" stroke="#A8AEA5" stroke-dasharray="5 4"/>
  <text x="414" y="754" class="s">VM GPU (NC4as_T4_v3)</text>

  <rect class="bx" x="592" y="734" width="150" height="32" stroke="#A8AEA5" stroke-dasharray="5 4"/>
  <text x="606" y="754" class="s">Gateway / APIM</text>
</g>
</svg>
