<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="'Instrument Sans',system-ui,-apple-system,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="cr">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  <style>
    .cy{fill:none;stroke-linecap:round;stroke-linejoin:round;filter:url(#cr)}
    .fl{stroke:none;filter:url(#cr)}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
  </style>
</defs>

<rect width="1280" height="440" fill="#FBFAF8"/>
<g filter="url(#soft)" opacity=".55">
  <ellipse cx="180" cy="60"  rx="330" ry="200" fill="#7C9A78" opacity=".30"/>
  <ellipse cx="1120" cy="120" rx="300" ry="210" fill="#9E93BC" opacity=".26"/>
  <ellipse cx="760" cy="430" rx="380" ry="190" fill="#C08B62" opacity=".22"/>
  <ellipse cx="440" cy="400" rx="260" ry="150" fill="#7BA0C4" opacity=".18"/>
</g>

<!-- ================= wordmark ================= -->
<text x="88" y="176" font-size="82" font-weight="600" fill="#1B1E1B" letter-spacing="-3.4">Almácigo</text>
<path d="M90 198 C210 193, 300 202, 404 196" class="cy" stroke="#7C9A78" stroke-width="4"/>

<text x="90" y="240" font-size="19" fill="#767E75">A hand-built inference control plane for LLMs.</text>
<text x="90" y="268" font-size="19" fill="#767E75">Small enough to read. Real enough to break.</text>

<text x="90" y="322" class="mono" font-size="13" fill="#A8AEA5">catalog</text>
<text x="176" y="322" class="mono" font-size="13" fill="#D3CFC7">·</text>
<text x="196" y="322" class="mono" font-size="13" fill="#A8AEA5">deployments</text>
<text x="322" y="322" class="mono" font-size="13" fill="#D3CFC7">·</text>
<text x="342" y="322" class="mono" font-size="13" fill="#A8AEA5">streaming playground</text>

<!-- endpoint -->
<path d="M90 356 L474 353" class="cy" stroke="#D3CFC7" stroke-width="2"/>
<text x="90" y="386" class="mono" font-size="13" fill="#7C9A78">POST /v1/chat/completions</text>
<text x="308" y="386" class="mono" font-size="13" fill="#A8AEA5">openai-compatible</text>

